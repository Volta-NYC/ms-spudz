    <rect x="12" y="12" width="4" height="2"/>
    <rect x="10" y="14" width="6" height="2"/>
    <rect x="8" y="16" width="6" height="2"/>
  </g>

  <!-- Potato eyes -->
  <g fill="#6a4322">
    <rect x="18" y="12" width="2" height="2"/>
    <rect x="20" y="18" width="2" height="2"/>
    <rect x="14" y="22" width="2" height="2"/>
