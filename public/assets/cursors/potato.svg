    <rect x="10" y="8" width="12" height="2"/>
    <rect x="8" y="10" width="16" height="2"/>
    <rect x="6" y="12" width="20" height="2"/>
    <rect x="6" y="14" width="20" height="2"/>
    <rect x="4" y="16" width="24" height="2"/>
    <rect x="4" y="18" width="24" height="2"/>
    <rect x="6" y="20" width="20" height="2"/>
    <rect x="6" y="22" width="20" height="2"/>
    <rect x="8" y="24" width="16" height="2"/>
    <rect x="10" y="26" width="12" height="2"/>
    <rect x="14" y="28" width="4" height="2"/>
