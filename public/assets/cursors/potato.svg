    <!-- Inner fill -->
    <g fill="#b88753">
      <rect x="10" y="11" width="12" height="2"/>
      <rect x="7" y="13" width="18" height="2"/>
      <rect x="5" y="15" width="22" height="2"/>
      <rect x="4" y="17" width="24" height="2"/>
