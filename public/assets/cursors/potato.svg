      <rect x="10" y="9" width="12" height="2"/>
      <rect x="7" y="11" width="18" height="2"/>
      <rect x="4" y="13" width="24" height="2"/>
      <rect x="3" y="15" width="26" height="2"/>
      <rect x="2" y="17" width="28" height="2"/>
      <rect x="3" y="19" width="26" height="2"/>
