<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <rect width="32" height="32" fill="none"/>

  <!-- Steam -->
  <g fill="#cfd4d8">
    <rect x="15" y="2" width="2" height="2"/>
    <rect x="17" y="4" width="2" height="2"/>
    <rect x="15" y="6" width="2" height="2"/>
  </g>

  <!-- Left baked potato half -->
  <g fill="#5c3716">
    <rect x="8" y="10" width="6" height="2"/>
    <rect x="6" y="12" width="10" height="2"/>
    <rect x="4" y="14" width="12" height="2"/>
    <rect x="4" y="16" width="10" height="2"/>
    <rect x="4" y="18" width="10" height="2"/>
    <rect x="6" y="20" width="10" height="2"/>
    <rect x="8" y="22" width="6" height="2"/>
  </g>
  <g fill="#8a5a2a">
    <rect x="8" y="12" width="6" height="2"/>
    <rect x="6" y="14" width="8" height="2"/>
    <rect x="6" y="16" width="6" height="2"/>
    <rect x="6" y="18" width="6" height="2"/>
    <rect x="8" y="20" width="6" height="2"/>
  </g>

  <!-- Right baked potato half -->
  <g fill="#5c3716">
    <rect x="18" y="10" width="6" height="2"/>
    <rect x="16" y="12" width="10" height="2"/>
    <rect x="16" y="14" width="12" height="2"/>
    <rect x="18" y="16" width="10" height="2"/>
    <rect x="18" y="18" width="10" height="2"/>
    <rect x="16" y="20" width="10" height="2"/>
    <rect x="18" y="22" width="6" height="2"/>
  </g>
  <g fill="#8a5a2a">
    <rect x="18" y="12" width="6" height="2"/>
    <rect x="18" y="14" width="8" height="2"/>
    <rect x="20" y="16" width="6" height="2"/>
    <rect x="20" y="18" width="6" height="2"/>
    <rect x="18" y="20" width="6" height="2"/>
  </g>

  <!-- Split interior -->
  <g fill="#f4d9a8">
    <rect x="12" y="12" width="2" height="2"/>
    <rect x="12" y="14" width="2" height="2"/>
    <rect x="10" y="16" width="4" height="2"/>
    <rect x="10" y="18" width="4" height="2"/>
    <rect x="12" y="20" width="2" height="2"/>

    <rect x="18" y="12" width="2" height="2"/>
    <rect x="18" y="14" width="2" height="2"/>
    <rect x="18" y="16" width="4" height="2"/>
    <rect x="18" y="18" width="4" height="2"/>
    <rect x="18" y="20" width="2" height="2"/>
  </g>

  <!-- Melted butter pixel -->
  <rect x="15" y="16" width="2" height="2" fill="#f5c35b"/>
</svg>
